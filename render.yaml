services:
  - type: web
    name: monitor-olx
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
